
name: Inspect CompNet

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect CompNet Model
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify uploaded files
        run: |
          echo "===== REPOSITORY FILES ====="
          ls -lh
          echo "===== CHECK REQUIRED FILES ====="
          test -f compnet-main.zip
          test -f net_params_tongji_600.pth
          echo "Both required files exist."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Extract CompNet source
        run: |
          unzip -q compnet-main.zip -d source
          echo "===== PROJECT FILES ====="
          find source -maxdepth 5 -type f | head -200

      - name: Install PyTorch CPU
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Locate model source files
        run: |
          echo "===== COMPNET.PY FILES ====="
          find source -type f -iname "compnet.py"
          echo "===== INFERENCE.PY FILES ====="
          find source -type f -iname "inference.py"

      - name: Inspect model source
        run: |
          MODEL_FILE=$(find source -type f -iname "compnet.py" | head -1)
          INFERENCE_FILE=$(find source -type f -iname "inference.py" | head -1)

          if [ -z "$MODEL_FILE" ]; then
            echo "ERROR: compnet.py not found"
            exit 1
          fi

          echo "===== COMPNET.PY ====="
          cat "$MODEL_FILE"

          if [ -n "$INFERENCE_FILE" ]; then
            echo "===== INFERENCE.PY ====="
            cat "$INFERENCE_FILE"
          else
            echo "WARNING: inference.py not found"
          fi

      - name: Inspect pretrained weights
        run: |
          python - <<'PY'
          import torch

          path = "net_params_tongji_600.pth"

          print("Loading checkpoint:", path)

          obj = torch.load(
              path,
              map_location="cpu",
              weights_only=True
          )

          print("\n===== CHECKPOINT INFORMATION =====")
          print("Checkpoint type:", type(obj))

          if isinstance(obj, dict):
              print("Top-level keys:")
              for key in list(obj.keys())[:50]:
                  print(" -", key)

              state = obj.get("state_dict", obj)

              if isinstance(state, dict):
                  print("\n===== PARAMETER SHAPES =====")

                  for key, value in state.items():
                      if hasattr(value, "shape"):
                          print(key, tuple(value.shape))
                      else:
                          print(key, type(value))

              else:
                  print("State dict is not a dictionary")

          else:
              print("Unexpected checkpoint object:", obj)

          print("\nCheckpoint inspection completed.")
          PY

      - name: Finish
        run: |
          echo "CompNet inspection workflow completed."

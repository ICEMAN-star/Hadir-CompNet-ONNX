
name: Inspect CompNet ONNX

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect-onnx:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Set up Python
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ==========================================
      # 2. Install dependencies
      # ==========================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install numpy==1.26.4
          pip install onnx==1.17.0
          pip install onnxruntime==1.20.1

      # ==========================================
      # 3. Find latest successful CompNet build
      # ==========================================
      - name: Find latest CompNet build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "Searching for latest successful build..."

          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "build-compnet-onnx.yml" \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: No successful CompNet build found."
            exit 1
          fi

          echo "Build Run ID: $RUN_ID"

          echo "BUILD_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      # ==========================================
      # 4. Download ONNX Artifact
      # ==========================================
      - name: Download ONNX Artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "Downloading CompNet ONNX artifact..."

          mkdir -p downloaded

          gh run download "$BUILD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "CompNet-ONNX-Tongji-600" \
            --dir downloaded

          echo "Downloaded files:"

          find downloaded -type f

          MODEL_FILE=$(find downloaded \
            -type f \
            -iname "*.onnx" | head -n 1)

          if [ -z "$MODEL_FILE" ]; then
            echo "ERROR: ONNX model not found."
            exit 1
          fi

          echo "MODEL_FILE=$MODEL_FILE" >> "$GITHUB_ENV"

          echo "Found model: $MODEL_FILE"

      # ==========================================
      # 5. Verify downloaded model
      # ==========================================
      - name: Verify downloaded ONNX
        shell: bash
        run: |
          set -e

          echo "Verifying ONNX file..."

          if [ ! -s "$MODEL_FILE" ]; then
            echo "ERROR: ONNX file missing or empty."
            exit 1
          fi

          ls -lh "$MODEL_FILE"

          echo "PASS: ONNX file downloaded successfully."

      # ==========================================
      # 6. Inspect ONNX structure and inference
      # ==========================================
      - name: Inspect ONNX structure
        shell: bash
        run: |

          cat > inspect_compnet.py <<'PY'
          import os
          import numpy as np
          import onnx
          import onnxruntime as ort

          model_path = os.environ["MODEL_FILE"]

          print("\n====================================")
          print("COMPNET ONNX MODEL INSPECTION")
          print("====================================")

          # ----------------------------------
          # File information
          # ----------------------------------

          print("\n[1] Model file information")

          file_size = os.path.getsize(model_path)

          print("Model path:", model_path)
          print(
              "File size:",
              round(file_size / (1024 * 1024), 2),
              "MB"
          )

          # ----------------------------------
          # Load ONNX
          # ----------------------------------

          print("\n[2] Loading ONNX model")

          model = onnx.load(model_path)

          print("IR version:", model.ir_version)
          print("Producer:", model.producer_name)
          print("Producer version:", model.producer_version)

          # ----------------------------------
          # Validate ONNX
          # ----------------------------------

          print("\n[3] Checking ONNX graph")

          onnx.checker.check_model(model)

          print("PASS: ONNX graph is valid.")

          # ----------------------------------
          # Operators
          # ----------------------------------

          print("\n[4] Model operators")

          operators = sorted(
              set(node.op_type for node in model.graph.node)
          )

          print("Total nodes:", len(model.graph.node))
          print("Unique operators:", len(operators))

          for op in operators:
              print("Operator:", op)

          # ----------------------------------
          # Tensor shape helper
          # ----------------------------------

          def get_shape(value_info):
              tensor = value_info.type.tensor_type
              shape = []

              for dim in tensor.shape.dim:
                  if dim.dim_value:
                      shape.append(dim.dim_value)
                  elif dim.dim_param:
                      shape.append(dim.dim_param)
                  else:
                      shape.append("dynamic")

              return shape

          # ----------------------------------
          # Inputs
          # ----------------------------------

          print("\n[5] Model inputs")

          for item in model.graph.input:
              tensor = item.type.tensor_type

              print("Input name:", item.name)
              print("Input shape:", get_shape(item))
              print("Input element type:", tensor.elem_type)

          # ----------------------------------
          # Outputs
          # ----------------------------------

          print("\n[6] Model outputs")

          for item in model.graph.output:
              tensor = item.type.tensor_type

              print("Output name:", item.name)
              print("Output shape:", get_shape(item))
              print("Output element type:", tensor.elem_type)

          # ----------------------------------
          # Create ONNX Runtime session
          # ----------------------------------

          print("\n[7] ONNX Runtime session")

          session = ort.InferenceSession(
              model_path,
              providers=["CPUExecutionProvider"]
          )

          print("PASS: ONNX Runtime loaded the model.")

          input_meta = session.get_inputs()
          output_meta = session.get_outputs()

          print("\nRuntime inputs:")

          for item in input_meta:
              print(item.name, item.shape, item.type)

          print("\nRuntime outputs:")

          for item in output_meta:
              print(item.name, item.shape, item.type)

          # ----------------------------------
          # Validate input count and type
          # ----------------------------------

          print("\n[8] Preparing test input")

          if len(input_meta) != 1:
              raise RuntimeError(
                  "Expected one input, found "
                  + str(len(input_meta))
              )

          input_info = input_meta[0]

          dtype_map = {
              "tensor(float)": np.float32,
              "tensor(double)": np.float64,
              "tensor(float16)": np.float16,
              "tensor(int64)": np.int64,
              "tensor(int32)": np.int32,
              "tensor(int16)": np.int16,
              "tensor(int8)": np.int8,
              "tensor(uint8)": np.uint8,
              "tensor(bool)": np.bool_
          }

          if input_info.type not in dtype_map:
              raise RuntimeError(
                  "Unsupported input type: "
                  + input_info.type
              )

          input_shape = []

          for dim in input_info.shape:
              if isinstance(dim, int) and dim > 0:
                  input_shape.append(dim)
              else:
                  input_shape.append(1)

          input_dtype = dtype_map[input_info.type]

          rng = np.random.default_rng(42)

          if np.issubdtype(input_dtype, np.floating):
              dummy_input = rng.standard_normal(
                  input_shape
              ).astype(input_dtype)

          elif np.issubdtype(input_dtype, np.bool_):
              dummy_input = np.ones(
                  input_shape,
                  dtype=input_dtype
              )

          else:
              dummy_input = np.zeros(
                  input_shape,
                  dtype=input_dtype
              )

          print("Input shape:", dummy_input.shape)
          print("Input dtype:", dummy_input.dtype)

          # ----------------------------------
          # Run inference
          # ----------------------------------

          print("\n[9] Running inference")

          results = session.run(
              None,
              {
                  input_info.name: dummy_input
              }
          )

          print("PASS: Inference completed.")

          # ----------------------------------
          # Validate output
          # ----------------------------------

          print("\n[10] Output verification")

          if len(results) != 1:
              raise RuntimeError(
                  "Expected one output, found "
                  + str(len(results))
              )

          output = results[0]

          print("Output shape:", output.shape)
          print("Output dtype:", output.dtype)

          if not np.issubdtype(
              output.dtype,
              np.floating
          ):
              raise RuntimeError(
                  "Output is not floating point."
              )

          if not np.isfinite(output).all():
              raise RuntimeError(
                  "Output contains NaN or infinity."
              )

          print("PASS: Output values are finite.")

          # ----------------------------------
          # Validate feature dimensions
          # ----------------------------------

          print("\n[11] Feature dimensions")

          if output.ndim != 2:
              raise RuntimeError(
                  "Expected 2D feature output."
              )

          if output.shape[1] != 512:
              raise RuntimeError(
                  "Expected 512-dimensional features, got "
                  + str(output.shape)
              )

          print("PASS: Feature dimensions = 512.")

          # ----------------------------------
          # Check normalization
          # ----------------------------------

          print("\n[12] Feature normalization")

          norms = np.linalg.norm(
              output,
              axis=1
          )

          print("Feature norms:", norms)

          if not np.allclose(
              norms,
              1.0,
              atol=1e-3
          ):
              raise RuntimeError(
                  "Feature vectors are not L2 normalized."
              )

          print("PASS: Features are L2 normalized.")

          # ----------------------------------
          # Final report
          # ----------------------------------

          print("\n====================================")
          print("COMPNET ONNX INSPECTION SUCCESS")
          print("====================================")

          print("ONNX graph: VALID")
          print("ONNX Runtime: WORKING")
          print("Inference: SUCCESSFUL")
          print("Feature dimensions: 512")
          print("Normalization: VERIFIED")

          PY

          python inspect_compnet.py

      # ==========================================
      # 7. Upload inspection report
      # ==========================================
      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CompNet-ONNX-Inspection-Report
          path: inspect_compnet.py
          if-no-files-found: warn
          retention-days: 30
